# WhisperRadar configuration
# Paths are relative to the directory containing this file.

db_path: data/whisperradar.db
audio_dir: data/audio
transcripts_dir: data/transcripts

# Set to "chrome" / "firefox" / "edge" to reuse browser cookies if YouTube
# starts bot-checking your requests. null = no cookies.
cookies_from_browser: null

# Optional: skip videos longer than this many seconds (null = no limit)
max_video_seconds: null

whisper:
  # tiny | base | small | medium | large-v3  (bigger = better + slower)
  model: small
  # null = auto-detect language per video, or force e.g. "en"
  language: null

# Studio (video production pipeline) automation hooks.
# Every stage also works fully by hand (paste text / upload files) - these
# hooks are optional. {placeholders} are replaced at runtime.
studio:
  # Named LLM providers (OpenAI-compatible chat APIs). The default is used
  # unless you pick another one in the Studio UI; keys can also come from
  # environment variables: WR_GLM_FLASH_API_KEY, WR_DEEPSEEK_API_KEY.
  llm_providers:
    - name: glm-flash
      base_url: https://api.b.ai/v1
      model: glm-5.3-flash
      api_key: null
    - name: deepseek
      base_url: https://api.b.ai/v1
      model: deepseek-v4.1-flash
      api_key: null
  llm_default: glm-flash
  # Target script length in words. null = match the source transcript's
  # length automatically; set a number to force a fixed target (e.g. 1200).
  script_words: null
  # OpenSpeaker (ai33.pro) narration: script -> API -> audio.mp3.
  # Needs the WR_AI33_API_KEY env var (key from the OpenSpeaker app).
  # {voice} is the voice picked in the dashboard's audio stage (per
  # production); empty = AI33_VOICE env var or the built-in edge default.
  tts_command: python D:\Repos\WhisperRadar\scripts\ai33_tts.py {script} {out} --voice {voice}
  # Optional overrides: ai33_api_key, ai33_voice, ai33_base_url
  ai33_api_key: null
  # Shortlist shown in the audio-stage dropdown (order kept). Find ids with
  #   python scripts\ai33_tts.py --voices --search <name>
  # Leave empty to browse the full catalog instead.
  ai33_voices:
    - elevenlabs_9BYUod15YOH2aePSd97v   # Vanessa Voyce - Warm & Relatable
    - minimax_209533299589191           # Bossy Lady
    - elevenlabs_1inhdZEdtH9n8sjwar16   # Charles - British
  # Which voices the picker offers: "favorites" = the voices you starred in
  # the OpenSpeaker app (GET /v3/favorites). Absent = the shortlist above
  # (or the full catalog when it is empty). The audio stage also has a
  # "★ Favorites" toggle that switches the list for the current page.
  ai33_voice_source: favorites
  # Renderly + ImgToVideo integration (images + final render).
  # renderly_channel: null = auto-create/reuse a "whisperradar" channel.
  renderly_url: http://127.0.0.1:8022
  renderly_channel: null
  renderly_upscale: 4
  imgtovideo_repo: D:\Repos\ImgToVideo
  # Google Flow image generation via Renderly's extension-v2 Playwright
  # driver (D:\Repos\Renderly\extension-v2). Needs `npm install` there once
  # and a signed-in Google session in its profile. Requires node on PATH.
  flow_driver_dir: D:\Repos\Renderly\extension-v2
  # Flow Driver service URL (extension-v2\server.js; started automatically
  # when a Flow render needs it, or by Renderly's start.bat).
  flow_driver_url: http://127.0.0.1:8030
  # Path to the master shotlist planning prompt (ImgToVideo's
  # manifest-authoring-brief.md). Read fresh from disk on every run, so edits
  # apply immediately. Default: <imgtovideo_repo>\docs\manifest-authoring-brief.md
  manifest_brief: null
  imagegen_command: null # optional override; default routes through Renderly
  merge_command: null    # optional override; default runs ImgToVideo.Cli

# Your channels. kind is "primary" or "similar"; active: false pauses a channel.
channels: []
#  - name: SomeSimilarChannel
#    id: UCxxxxxxxxxxxxxxxxxxxxxx
#    kind: similar
#    active: true
