# WhisperRadar configuration
# Paths are relative to the directory containing this file.

db_path: data/whisperradar.db
audio_dir: data/audio
transcripts_dir: data/transcripts

# Set to "chrome" / "firefox" / "edge" to reuse browser cookies if YouTube
# starts bot-checking your requests. null = no cookies.
cookies_from_browser: null

# Optional: skip videos longer than this many seconds (null = no limit)
max_video_seconds: null

whisper:
  # tiny | base | small | medium | large-v3  (bigger = better + slower)
  model: small
  # null = auto-detect language per video, or force e.g. "en"
  language: null

# Studio (video production pipeline) automation hooks.
# Every stage also works fully by hand (paste text / upload files) - these
# hooks are optional. {placeholders} are replaced at runtime.
studio:
  # LLM for script + image-prompt writing: openai | ollama | none
  # "openai" = any OpenAI-compatible chat API (DeepSeek, GLM, OpenAI, ...)
  llm: openai
  llm_api_key: null      # or environment variable WR_LLM_API_KEY (recommended)
  # DeepSeek:   base_url https://api.deepseek.com           model deepseek-chat
  # GLM (z.ai): base_url https://api.z.ai/api/paas/v4        model glm-5.3-flash
  # GLM (cn):   base_url https://open.bigmodel.cn/api/paas/v4
  llm_base_url: https://api.deepseek.com
  llm_model: deepseek-chat
  ollama_model: null     # used when llm: ollama
  tts_command: null      # e.g. python C:\path\chatterbox\run_tts.py {script} {out}
  imagegen_command: null # e.g. renderly --prompt-file {prompts} --outdir {outdir}
  merge_command: null    # e.g. imgtovideo --images {images} --audio {audio} --srt {srt} --out {out}

# Your channels. kind is "primary" or "similar"; active: false pauses a channel.
channels: []
#  - name: SomeSimilarChannel
#    id: UCxxxxxxxxxxxxxxxxxxxxxx
#    kind: similar
#    active: true
