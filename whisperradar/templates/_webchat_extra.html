{# Run forms: the model / thinking / switch controls follow the Writer and
   Judge you pick - only the chosen sites' controls show. Sites you added in
   Settings > Web chat LLMs are added to the dropdowns, with the models the app
   found on their page. #}
<script>
(function () {
  var SITES = {{ webchat_custom_sites()|tojson }};
  var BUILTIN = {zai: ['zai_model', 'zai_thinking'],
                 deepseek: ['deepseek_deepthink', 'deepseek_search']};
  var BUILTIN_CTRLS = {
    zai: [['Model', 'zai_model', [['flash', 'GLM-5.3-Flash'], ['5.3', 'GLM-5.3'], ['5.2', 'GLM-5.2']], 'z.ai model for this run'],
          ['Deep Think', 'zai_thinking', [['Low', 'Low'], ['High', 'High'], ['Max', 'Max']], 'z.ai Deep Think level']],
    deepseek: [['DeepThink', 'deepseek_deepthink', [['on', 'On'], ['off', 'Off']], "DeepSeek's DeepThink switch"],
               ['Search', 'deepseek_search', [['off', 'Off'], ['on', 'On']], "DeepSeek's web Search switch"]]
  };
  function sel(name, items, title) {
    var s = document.createElement('select'); s.name = name; s.title = title || '';
    items.forEach(function (it) { s.add(new Option(it[1], it[0])); });
    return s;
  }
  function field(text, el) {
    var l = document.createElement('label'); l.appendChild(document.createTextNode(text + ' '));
    l.appendChild(el); return l;
  }
  document.querySelectorAll('select[name=writer], select[name=judge]').forEach(function (s) {
    SITES.forEach(function (site) {
      if (![].some.call(s.options, function (o) { return o.value === site.key; })) {
        s.add(new Option(site.name, site.key));
      }
    });
  });
  var forms = new Set();
  document.querySelectorAll('select[name=writer], select[name=judge]').forEach(function (s) {
    var form = s.closest('form');
    if (!form || forms.has(form)) return;
    forms.add(form);
    var row = document.createElement('div');
    row.style.cssText = 'flex-basis:100%;display:flex;gap:8px;align-items:center;flex-wrap:wrap';
    SITES.forEach(function (site) {
      var grp = document.createElement('span'); grp.dataset.site = site.key;
      grp.style.cssText = 'display:inline-flex;gap:8px;align-items:center;flex-wrap:wrap';
      var tag = document.createElement('span'); tag.className = 'muted';
      tag.style.fontSize = '12px'; tag.textContent = site.name + ':'; grp.appendChild(tag);
      if (site.paid && (site.models || []).length) {
        grp.appendChild(field('Model', sel('wc_' + site.key + '_model',
          [['', "as the site has it"]].concat(site.models.map(function (m) { return [m.id, m.label]; })),
          site.name + ' model for this run')));
      }
      if ((site.levels || []).length) {
        grp.appendChild(field(site.level_label || 'Level', sel('wc_' + site.key + '_level',
          [['', "as the site has it"]].concat(site.levels.map(function (m) { return [m.id, m.label]; })),
          site.name + ' level for this run')));
      }
      (site.toggles || []).forEach(function (t) {
        grp.appendChild(field(t.label, sel('wc_' + site.key + '_' + t.id,
          [['off', 'Off'], ['on', 'On']], site.name + ' ' + t.label)));
      });
      if (grp.children.length > 1) row.appendChild(grp);
    });
    // the built-ins' controls too: z.ai/DeepSeek only had their Model/Switch
    // selects in some forms' static markup - every run form gets them, and
    // each is shown only while that site is the chosen Writer or Judge
    Object.keys(BUILTIN).forEach(function (key) {
      var grp = document.createElement('span'); grp.dataset.site = key;
      grp.style.cssText = 'display:inline-flex;gap:8px;align-items:center;flex-wrap:wrap';
      var tag = document.createElement('span'); tag.className = 'muted';
      tag.style.fontSize = '12px';
      tag.textContent = (key === 'zai' ? 'z.ai' : 'DeepSeek') + ':';
      grp.appendChild(tag);
      BUILTIN_CTRLS[key].forEach(function (c) {
        if (!form.querySelector('select[name=' + c[1] + ']'))
          grp.appendChild(field(c[0], sel(c[1], c[2], c[3])));
      });
      if (grp.children.length > 1) row.appendChild(grp);
    });
    if (row.children.length) {
      // insert before the submit button - but on plan/kit/research/thumbs the
      // button sits inside a wrapper div, so walk up to the form's own child
      // (insertBefore with a non-child threw and killed the whole setup)
      var btn = form.querySelector('button[type=submit]');
      var anchor = btn;
      while (anchor && anchor.parentElement !== form)
        anchor = anchor.parentElement;
      if (anchor) form.insertBefore(row, anchor);
      else form.appendChild(row);
    }
    function sync() {
      var chosen = {};
      form.querySelectorAll('select[name=writer], select[name=judge]').forEach(function (x) { chosen[x.value] = 1; });
      Object.keys(BUILTIN).forEach(function (key) {
        BUILTIN[key].forEach(function (n) {
          var el = form.querySelector('select[name=' + n + ']');
          if (el) (el.closest('label') || el).style.display = chosen[key] ? '' : 'none';
        });
      });
      form.querySelectorAll('[data-site]').forEach(function (g) {
        g.style.display = chosen[g.dataset.site] ? 'inline-flex' : 'none';
      });
    }
    // The run reloads (or redirects back to) this page, which would put the
    // Writer/Judge selects on their first options - z.ai (GLM) and DeepSeek -
    // and the LLMs you added back at the end, unselected. Remember this form's
    // picks (by its action) and restore them after the options are re-added.
    // Keyed by the form's action with ids removed (/studio/7/webchat/script ->
    // /studio/#/webchat/script), so the picks follow you into every production;
    // a global "last" key fills in forms that were never used.
    var KEY = 'wrwc:' + (form.getAttribute('action') || location.pathname).replace(/\d+/g, '#');
    var LAST = 'wrwc:last';
    var watched = function () {
      return form.querySelectorAll('select[name=writer], select[name=judge], select[name^=wc_], select[name^=zai_], select[name^=deepseek_]');
    };
    function saveSel() {
      try {
        var o = {}, g = {};
        try { g = JSON.parse(localStorage.getItem(LAST) || '{}') || {}; } catch (e) {}
        watched().forEach(function (x) { o[x.name] = x.value; g[x.name] = x.value; });
        localStorage.setItem(KEY, JSON.stringify(o));
        localStorage.setItem(LAST, JSON.stringify(g));
      } catch (e) {}
    }
    function restoreSel() {
      try {
        var own = JSON.parse(localStorage.getItem(KEY) || '{}') || {};
        var last = JSON.parse(localStorage.getItem(LAST) || '{}') || {};
        var o = Object.assign({}, own, last);
        Object.keys(o).forEach(function (n) {
          var el = form.querySelector('select[name=' + CSS.escape(n) + ']');
          if (el && [].some.call(el.options, function (op) { return op.value === o[n]; }))
            el.value = o[n];
        });
      } catch (e) {}
    }
    restoreSel();
    form.querySelectorAll('select[name=writer], select[name=judge]').forEach(function (x) {
      x.addEventListener('change', sync);
      x.addEventListener('change', saveSel);
    });
    watched().forEach(function (x) {
      x.addEventListener('change', saveSel);
    });
    form.addEventListener('submit', saveSel);
    sync();
  });
})();
</script>
